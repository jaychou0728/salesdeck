services:
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      NODE_ENV: production
      DEMO_MODE: "true"
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
    volumes: ["./data:/app/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
